version: 2

models:
  - name: arbigrants_one_day_active_wallets
    meta:
      blockchain: arbitrum_one
    description: "Grantee active wallets"
    tests:
      - unique:
          column_name: "date"
    columns:
      - &day
        name: date
        description: "date" 
      - &category
        name: category
        description: "category of wallet"
      - &active_wallets
        name: active_wallets
        description: "quantity of active wallets"